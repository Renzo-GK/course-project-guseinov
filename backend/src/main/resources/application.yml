spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meeting_room}
    username: ${SPRING_DATASOURCE_USERNAME:meeting}
    password: ${SPRING_DATASOURCE_PASSWORD:meeting}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-please-change-in-production-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
